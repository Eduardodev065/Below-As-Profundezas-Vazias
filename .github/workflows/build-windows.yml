name: Build Below for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, codex/python-java-runtime]

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare bundled Python, Java and game engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime/python, runtime/java, runtime/classes | Out-Null
          $py = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $py
          Expand-Archive $py runtime/python -Force
          $pth = Get-ChildItem runtime/python/*._pth | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#import site', 'import site' | Set-Content $pth.FullName
          javac --release 17 -d runtime/classes game/java/BelowGameEngine.java
          jar --create --file game-engine.jar --main-class BelowGameEngine -C runtime/classes .
          jlink --add-modules java.base --strip-debug --no-header-files --no-man-pages --output runtime/java
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Below-Windows
          path: dist/Below.exe
          if-no-files-found: error
